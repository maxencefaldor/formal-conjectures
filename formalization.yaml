version: "v0.4"

project:
  name: "Erdős Problem 14 (Parts (i) and (ii)): Uniform square-root lower bound for non-unique sums"
  description: >-
    An independent Lean 4 / Mathlib formalization of the theorem of Liam Kruer and Jensen
    Kohlmeyer (2026) resolving both parts of Erdős Problem 14. For every A subset N and every
    N >= 2 * 10000^4, the number of integers in {1, ..., N} not uniquely representable as an
    unordered sum of two elements of A is at least sqrt(N) / 6000. This establishes Part (i)
    (nonUniqueSumCount A >> N^(1/2 - eps) for all eps > 0) and refutes Part (ii) (no A has
    nonUniqueSumCount A = o(sqrt(N))). Both compared declarations match
    `FormalConjectures/ErdosProblems/14.lean` verbatim.
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

classification:
