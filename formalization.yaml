status:
  scope: >-
    Proves the compared existential affine-coset theorem `Green51.green_51.one_half` (existence
    of some constant `c : Nat` with `n <= guaranteedMaxCosetDim n alpha + c`). Internally,
    `Solution.lean` establishes this by proving a stronger linear-subspace codimension bound
    `codim H <= 1 + 256 * e * n * eps^2` for `0 <= eps <= 1/4`; that linear-subspace property
    and explicit constant are proof-level intermediate results rather than part of the compared
    theorem's type. Does not formalize the general-density or arithmetic-progression variants in
    `51.lean`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

