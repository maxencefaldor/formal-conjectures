    authors:
      - "Jensen Kohlmeyer"
      - "Liam Kruer"
    id: "https://liamkruer.com/assets/work/conjectures/problems/green-51/paper/proof.pdf"
    type: "paper"
    location: "Main Theorem (codim H <= 1 + 256 e n eps^2), September 2026 draft"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Independent Lean 4 formalization following the five-part architecture of Kohlmeyer and
      Kruer: ternary separator variance estimate, Walsh-Fourier face variance identity,
      Bernoulli face averaging, Fourier analysis on F_2^n, and minimal covering obstruction via
      polynomial interpolation.
