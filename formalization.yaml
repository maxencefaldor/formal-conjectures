# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Erdős Problem 14 (Parts (i) and (ii)): Uniform square-root lower bound for non-unique sums"
  description: >-
    An independent Lean 4 / Mathlib formalization of the theorem of Liam Kruer and Jensen
    Kohlmeyer (2026) resolving both parts of Erdős Problem 14. For every A subset N and every
    N >= 2 * 10000^4, the number of integers in {1, ..., N} not uniquely representable as an
    unordered sum of two elements of A is at least sqrt(N) / 6000. This establishes Part (i)
    (nonUniqueSumCount A >> N^(1/2 - eps) for all eps > 0) and refutes the Part (ii) question
    (no A has nonUniqueSumCount A = o(sqrt(N))). The compared declarations in `Challenge.lean`
    match `FormalConjectures/ErdosProblems/14.lean` for Part (i) and state the exact negation
    of the open existential question for Part (ii).
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

classification:
  arxiv:
    - "math.NT"
    - "math.CO"
  msc2020:
    - "11B13"
    - "11B30"

sources:
