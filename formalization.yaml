    authors:
      - "Liam Kruer"
      - "Jensen Kohlmeyer"
    id: "https://liamkruer.com/assets/work/conjectures/problems/erdos-14/paper/proof.pdf"
    type: "paper"
    location: "Main Theorem (uniform sqrt(N) lower bound), September 13, 2026 draft"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Independent Lean 4 formalization establishing the uniform bound
      nonUniqueSumCount A N >= (1 / 6000) * sqrt(N) for N >= 2 * 10000^4, implying both
      Part (i) and the negative answer to Part (ii).
