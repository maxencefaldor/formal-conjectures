# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Disproof of the Pierce-Birkhoff conjecture in dimension 30"
  description: >-
    A Lean 4 / Mathlib formalization disproving the Pierce-Birkhoff conjecture as
    stated in google-deepmind/formal-conjectures (`PierceBirkhoff.pierce_birkhoff_conjecture`).
    Following Lai, Lim, and Ren (arXiv:2609.10420, 2026), we construct a piecewise-quadratic
    function on R^30 identified with pairs of symmetric 5x5 real matrices, prove that it admits
    a finite closed semi-algebraic polynomial cover (`IsPiecewiseMvPolynomial`), and prove
    directly that it cannot be written as a finite supremum of finite infima of multivariate
    polynomials.
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

classification:
  arxiv:
    - "math.AG"
    - "math.AC"
  msc2020:
    - "14P10"
    - "13P99"

sources:
  - title: "Pierce-Birkhoff conjecture is false"
    authors:
      - "Zehua Lai"
      - "Lek-Heng Lim"
      - "Junyu Ren"
    id: "arXiv:2609.10420"
    type: "paper"
    location: "Theorem 7 (30-dimensional counterexample)"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Formalizes the 30-dimensional symmetric-matrix counterexample of arXiv:2609.10420,
      explicitly establishes a finite closed semi-algebraic covering (`IsPiecewiseMvPolynomial`,
      not addressed in the paper's partition formulation), and refutes the exact max-of-min
      normal form `iSup i, iInf j, eval x (g i j)` directly.
  - title: "Pierce-Birkhoff conjecture"
    id: "https://en.wikipedia.org/wiki/Pierce%E2%80%93Birkhoff_conjecture"
    type: "web discussion"
    relationship: "background"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/5bd8bfb9def462c19a87d2d275af3db3341dc727/FormalConjectures/Wikipedia/PierceBirkhoff.lean"
    relationship: "builds-on"
    note: >-
      Refutes `PierceBirkhoff.pierce_birkhoff_conjecture` verbatim from
      `FormalConjectures/Wikipedia/PierceBirkhoff.lean` at commit `5bd8bfb9def462c19a87d2d275af3db3341dc727`, addressing
      both residual gaps noted for Pierce-Birkhoff in issue #5602.

status:
  scope: >-
    Proves the negation of `PierceBirkhoff.pierce_birkhoff_conjecture` via a 30-dimensional
    counterexample satisfying `IsPiecewiseMvPolynomial`. Does not formalize the n=1 or n=2
    positive cases (`pierce_birkhoff_conjecture_dim_one`, `pierce_birkhoff_conjecture_dim_two`).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent"
      models:
        - "Gemini"

fidelity:
  divergences: >-
    None relative to `FormalConjectures/Wikipedia/PierceBirkhoff.lean` at commit 5bd8bfb9def462c19a87d2d275af3db3341dc727.
    Note that the formal-conjectures statement allows empty finite index types `ι` or `κ`
    (with Lean's default `sSup ∅ = 0` on `ℝ`); the proof handles empty index types explicitly
    by evaluating at a point where `f x = 1 ≠ 0`.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Definitions `IsSemiAlgebraic` and `IsPiecewiseMvPolynomial` verified verbatim against
    `FormalConjectures/Wikipedia/PierceBirkhoff.lean` (commit 5bd8bfb9def462c19a87d2d275af3db3341dc727); empty index types
    and closed-cover conditions audited.

alignment:
  namespace: "PierceBirkhoff"
  statements:
    - source: "Pierce-Birkhoff conjecture (negation); Lai, Lim, and Ren (arXiv:2609.10420)"
      lean: "PierceBirkhoff.pierce_birkhoff_conjecture"
      module: "Challenge"
      status: "proved"
      note: "Negation of the exact `FormalConjectures` max-of-min statement over closed semi-algebraic covers."

acknowledgements: "Built on Mathlib and google-deepmind/formal-conjectures."
