version: "v0.4"

project:
  name: "OEIS A092243: Kernel-verified witness that the prime-gap tug-of-war score exceeds 0 past 250000"
  description: >-
    A pure Lean 4 kernel-verified proof (using no `native_decide`) of `OeisA92243.conjecture1`
    from google-deepmind/formal-conjectures: the prime-gap tug-of-war score a(n) satisfies
    a(n) > 0 for some n > 250000. Explicitly, we verify a(261150) = 1 by certifying a bitmask
    sieve of all primes up to p_261150 = 3666581 (represented on odd numbers up to M = 1833290),
    computing gap-increase and gap-decrease bitmasks, and counting bits with a proved SWAR
    popcount evaluated by `rfl`, confirming the computational zero-crossing at 261149 recorded
    in OEIS A175102.
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

