version: "v0.4"

project:
  name: "Ben Green's Open Problem 51 at density one half (Sanders' Question 5.1)"
  description: >-
    An independent Lean 4 / Mathlib formalization resolving Sanders' Question 5.1 (Ben Green's
    Open Problem 51 at density 1/2), following the proof of Jensen Kohlmeyer and Liam Kruer
    (2026). The compared declaration matches `Green51.green_51.one_half` verbatim from
    google-deepmind/formal-conjectures: for every k > 0, there exists a constant c : Nat such
    that for all sufficiently large n and every A subset F_2^n of density alpha > 1/2 - k / sqrt(n),
    the sumset A + A contains an affine coset of dimension at least n - c (codimension at most c).
    As a proof-level intermediate step inside `Solution.lean` (not stated in the compared theorem's
    type), the proof constructs a linear subspace of codimension at most ceil(1 + 256 * e * k^2).
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

classification:
  arxiv:
    - "math.CO"
    - "math.NT"
  msc2020:
    - "11B30"
    - "11B13"

sources:
