# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Disproof of Firoozbakht's conjecture on OEIS A086766"
  description: >-
    A Lean 4 / Mathlib disproof of Farideh Firoozbakht's 2015 conjecture on OEIS A086766
    (`OeisA86766.conjecture2` in google-deepmind/formal-conjectures), which asserted that
    for every positive integer n not of the form 10^m there exists r >= 1 such that the
    r-fold decimal concatenation of n followed by the digit 1 is prime. We exhibit two
    explicit 6-digit counterexamples, n = 104040 and n = 750760, proving via algebraic
    difference-of-squares factorizations that every candidate is composite for all r >= 1.
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11A41"
    - "11B83"

sources:
  - title: "Algebraic difference-of-squares counterexamples n = 104040 and n = 750760 to Firoozbakht's conjecture on OEIS A086766"
    type: "original-proof"
    relationship: "other"
    note: >-
      First presentation of the counterexamples n = 104040 and n = 750760 and their algebraic
      primality obstructions for all r >= 1. No prior external proof or counterexample was found
      on OEIS A086766 or in literature searches as of November 2026.
  - title: "OEIS A086766: Smallest r such that (concatenation of n, r times) * 10 + 1 is prime"
    authors:
      - "Amarnath Murthy"
    contributors:
      - name: "Farideh Firoozbakht"
        role: "problem-proposer"
    id: "https://oeis.org/A086766"
    type: "web discussion"
    location: "Comment by Farideh Firoozbakht, Jan 07 2015"
    relationship: "background"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/5bd8bfb9def462c19a87d2d275af3db3341dc727/FormalConjectures/OEIS/86766.lean"
    relationship: "builds-on"
    note: >-
      Refutes `OeisA86766.conjecture2` verbatim from `FormalConjectures/OEIS/86766.lean`
      at commit `5bd8bfb9def462c19a87d2d275af3db3341dc727`.

status:
  scope: >-
    Proves `a 104040 = 0`, `a 750760 = 0`, and the negation of `OeisA86766.conjecture2`.
    Does not address `conjecture1` or `conjecture3` in `86766.lean`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent"
      models:
        - "Gemini"

fidelity:
  divergences: >-
    None relative to `FormalConjectures/OEIS/86766.lean` at commit 5bd8bfb9def462c19a87d2d275af3db3341dc727. The sequence
    definition `a` is copied verbatim and `conjecture2` is its exact logical negation.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Both algebraic identities and digit lengths checked directly in Lean and audited by hand
    against OEIS A086766; axioms verified.

alignment:
  namespace: "OeisA86766"
  statements:
    - source: "OEIS A086766, Firoozbakht's conjecture (negation)"
      lean: "OeisA86766.conjecture2"
      module: "Challenge"
      status: "proved"
      note: "Exact negation of `OeisA86766.conjecture2` in `FormalConjectures/OEIS/86766.lean`."
    - source: "Counterexample n = 104040"
      lean: "OeisA86766.a_104040_eq_zero"
      module: "Challenge"
      status: "proved"
      note: "Proves `a 104040 = 0` via `999999 * p = (1020 * 10^(3r) - 201)(1020 * 10^(3r) + 201)`."
    - source: "Counterexample n = 750760"
      lean: "OeisA86766.a_750760_eq_zero"
      module: "Challenge"
      status: "proved"
      note: "Proves `a 750760 = 0` via `999999 * P = (2740 * 10^(3r) - 2551)(2740 * 10^(3r) + 2551)`."

acknowledgements: "Built on Mathlib and google-deepmind/formal-conjectures."
