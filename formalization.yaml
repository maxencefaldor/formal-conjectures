# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Ben Green's Open Problem 40 (radius 2): asymptotically optimal binary linear covering codes"
  description: >-
    A Lean 4 / Mathlib formalization of the theorem of Jensen Kohlmeyer and Liam Kruer (2026)
    resolving the radius-2 question in Ben Green's Open Problem 40: the asymptotic binary linear
    covering density f(2) equals 1. Using admissible binary quadratic maps and a codimension-doubling
    interpolation step, we construct linear covering subspaces of radius 2 of arbitrarily large
    ambient dimension whose covering density approaches 1, matching `Green40.green_40.f_two_eq_one`
    verbatim from google-deepmind/formal-conjectures.
  authors:
    - "Maxence Faldor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maxence Faldor"

classification:
  arxiv:
    - "math.CO"
    - "math.IT"
  msc2020:
    - "94B65"
    - "05B40"

sources:
  - title: "Asymptotically optimal binary linear covering codes of radius two"
    authors:
      - "Jensen Kohlmeyer"
      - "Liam Kruer"
    id: "https://liamkruer.com/assets/work/conjectures/problems/green-40/paper/proof.pdf"
    type: "paper"
    location: "Main Theorem (f(2) = 1), September 15, 2026 draft"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Formalizes the Kohlmeyer-Kruer admissible quadratic map construction and covering
      density bound 1 + 12 / 2^t -> 1. The authors' public archive (`green-40-source.zip`)
      lists no uploaded Lean source; this is a standalone Lean 4 formalization.
  - title: "100 Open Problems"
    authors:
      - "Ben Green"
    id: "https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf#problem.40"
    type: "other"
    location: "Problem 40"
    relationship: "background"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/5bd8bfb9def462c19a87d2d275af3db3341dc727/FormalConjectures/GreensOpenProblems/40.lean"
    relationship: "builds-on"
    note: >-
      Proves `Green40.green_40.f_two_eq_one` verbatim from
      `FormalConjectures/GreensOpenProblems/40.lean` at commit `5bd8bfb9def462c19a87d2d275af3db3341dc727`.

status:
  scope: >-
    Proves `Green40.green_40.f_two_eq_one : f 2 = 1`. Does not address whether `f r -> ∞`
    as `r -> ∞` or `f r = 1` for `r >= 3`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent"
      models:
        - "Gemini"

fidelity:
  divergences: >-
    None relative to `FormalConjectures/GreensOpenProblems/40.lean` at commit 5bd8bfb9def462c19a87d2d275af3db3341dc727.
    `𝔽` and `𝔽₂` are inlined verbatim from `FormalConjecturesForMathlib/Data/ZMod/Fp.lean`.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Definitions and theorem statement verified verbatim against
    `FormalConjectures/GreensOpenProblems/40.lean` (commit 5bd8bfb9def462c19a87d2d275af3db3341dc727); axioms checked.

alignment:
  namespace: "Green40"
  statements:
    - source: "Ben Green's Open Problem 40 (f(2) = 1); Kohlmeyer and Kruer (2026)"
      lean: "Green40.green_40.f_two_eq_one"
